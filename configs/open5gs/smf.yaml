logger:
  file:
    path: /var/log/open5gs/smf.log
smf:
  p-cscf:
    - 172.17.9.48
  sbi:
    server:
      - address: 127.0.0.4
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
  pfcp:
    server:
      - address: 127.0.0.4
    client:
      upf:
        - address: 127.0.0.7
  gtpc:
    server:
      - address: 127.0.0.4
  gtpu:
    server:
      - address: 127.0.0.4
  metrics:
    server:
      - address: 127.0.0.4
        port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
    - subnet: cafe::/48
      dnn: internet
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dnn: ims
    - subnet: cafe:1::/48
      dnn: ims
  dns:
    - 192.168.40.10
    - 192.168.40.2
    - 2001:4860:4860::8888
  mtu: 1400
  freeDiameter: /etc/freeDiameter/smf.conf
